<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #203c39;
        background: transparent;
        font:
          14px system-ui,
          sans-serif;
      }
      .card {
        border-radius: 18px;
        background: #edf5f0;
        padding: 24px;
        border: 1px solid #d8e8df;
      }
      .eyebrow {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.6px;
        color: #54796c;
        text-transform: uppercase;
      }
      h1 {
        font-size: 23px;
        margin: 8px 0 4px;
        letter-spacing: -0.5px;
      }
      .location,
      .time {
        color: #547269;
        font-size: 12px;
        margin: 0;
        line-height: 1.6;
      }
      .now {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 22px 0;
      }
      .icon {
        font-size: 55px;
      }
      .temperature {
        font-size: 48px;
        letter-spacing: -2px;
        line-height: 1.1;
      }
      .condition {
        margin: 5px 0 0;
        color: #456357;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        border-block: 1px solid #d5e3db;
        padding: 16px 0;
      }
      .metrics dt {
        font-size: 11px;
        color: #547269;
      }
      .metrics dd {
        margin: 5px 0 0;
        font-weight: 600;
        font-size: 16px;
      }
      h2 {
        font-size: 12px;
        margin: 20px 0 14px;
      }
      .forecast {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .day {
        background: #ffffffa8;
        border-radius: 10px;
        padding: 12px 8px;
        text-align: center;
      }
      .day p {
        margin: 5px 0;
        font-size: 12px;
      }
      .day .symbol {
        font-size: 25px;
        margin: 8px 0;
      }
      .low {
        color: #67877b;
      }
      .rain {
        color: #547269;
        font-size: 10px !important;
      }
      .source {
        margin: 18px 0 0;
        font-size: 10px;
        color: #547269;
        line-height: 1.6;
      }
      .source a {
        color: inherit;
      }
      .selection {
        margin-top: 8px;
        font-size: 10px;
        color: #547269;
      }
      @media (max-width: 400px) {
        .card {
          padding: 17px;
        }
        h1 {
          font-size: 21px;
        }
        .metrics dd {
          font-size: 14px;
        }
        .metrics dt {
          font-size: 10px;
        }
        .temperature {
          font-size: 42px;
        }
        .forecast {
          gap: 5px;
        }
        .day {
          padding: 10px 4px;
        }
      }
    </style>
  </head>
  <body>
    <article class="card" id="weather" aria-live="polite">
      Preparando tarjeta…
    </article>
    <!-- APP_SCRIPT -->
  </body>
</html>
